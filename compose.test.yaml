name: finfolk-tests
services:
  postgres:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: finfolk-test
      POSTGRES_DB: finfolk_test_repl
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finfolk_test_repl"]
      interval: 1s
      timeout: 5s
      retries: 60
