# Dedicated local test stack. No hosted project is linked by the test tools.
project_id = "finfolk-tests"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

# Suites install generated Clojure SQL into isolated finfolk_test_* databases.
[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false
port = 55439

[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55434

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = []

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
