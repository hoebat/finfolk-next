name: Generate, test and build FinFolk Next
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: '2.12.0'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: foundation-${{ runner.os }}-${{ hashFiles('project.version', 'project.clj') }}
      - run: corepack enable
      - run: make bootstrap
      - name: Validate ocean dataset catalog and materialized assets
        run: .venv/bin/python scripts/ocean_catalog.py validate
      - run: make check-generated
      - run: make test
      - run: make test-db
      - run: corepack yarn playwright install --with-deps chromium firefox webkit
      - run: make test-browser
      - name: Build native Next app with Netlify adapter (no deployment)
        run: npx --yes netlify-cli build --offline --context deploy-preview --filter @finfolk/web-main
        env:
          NETLIFY_TELEMETRY_DISABLED: '1'
          NETLIFY_SKEW_PROTECTION_TOKEN: finfolk-ci-${{ github.sha }}
      - run: node scripts/check_netlify_output.mjs
      - name: Validate packaged SSR in the Lambda filesystem with local Blobs
        run: npx --yes --package netlify-cli -c 'node tests/test_netlify_lambda_bundle.mjs'
      - run: corepack yarn deploy:next:api --dry-run --outdir .cache/api-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finfolk-next-test-results
          path: |
            .cache/test-results
            .cache/browser-results
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: finfolk-next-site
          path: |
            .cache/next-site
            js/finfolk-next/site/web-main/.netlify/static
            js/finfolk-next/site/web-main/.netlify/functions
            js/finfolk-next/site/web-main/.netlify/deploy-config
            js/finfolk-next/site/web-main/.netlify/deploy
            js/finfolk-next/site/web-main/.netlify/edge-functions-dist
            js/finfolk-next/site/web-main/.netlify/edge-functions-import-map.json
            js/finfolk-next/site/web-main/.netlify/netlify.toml
          include-hidden-files: true
