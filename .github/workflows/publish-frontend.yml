name: Publish FinFolk frontend
run-name: Publish FinFolk frontend from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finfolk-frontend-production
  cancel-in-progress: false

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != refs/heads/main ]; then
            echo 'Select main when running this production workflow.' >&2
            exit 1
          fi

  verify:
    needs: check-branch
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://finfolk.com.au
    env:
      NETLIFY_SITE_ID: fe66fb45-09ab-4e37-8474-3a4f2e162123
      NETLIFY_TELEMETRY_DISABLED: '1'
      NETLIFY_SKEW_PROTECTION_TOKEN: finfolk-publish-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check publishing credential
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo 'Configure the NETLIFY_AUTH_TOKEN Actions secret before publishing.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: '2.12.0'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: foundation-${{ runner.os }}-${{ hashFiles('project.version', 'project.clj') }}
      - name: Install pinned publishing CLI
        run: |
          corepack enable
          npm install --prefix .cache/netlify-tools --no-save --package-lock=false netlify-cli@27.16.2
          echo "$GITHUB_WORKSPACE/.cache/netlify-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build the production artifact
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify build --context production --filter @finfolk/web-main
      - name: Verify packaged files and server runtime
        run: |
          node scripts/check_netlify_output.mjs
          node tests/test_netlify_lambda_bundle.mjs
      - name: Deploy an isolated preview of this artifact
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify deploy --no-build --context production --filter @finfolk/web-main --site "$NETLIFY_SITE_ID" --json > .cache/frontend-preview-deploy.json
      - name: Verify the hosted preview
        run: |
          preview_url=$(jq -er '.deploy_url | select(startswith("https://"))' .cache/frontend-preview-deploy.json)
          NETLIFY_TEST_URL="$preview_url" node tests/test_netlify_release_http.mjs
      - name: Publish the verified artifact
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify deploy --no-build --context production --filter @finfolk/web-main --site "$NETLIFY_SITE_ID" --prod --message "GitHub Actions $GITHUB_SHA" --json > .cache/frontend-production-deploy.json
      - name: Record the published release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          deploy_url=$(jq -er '.deploy_url | select(startswith("https://"))' .cache/frontend-production-deploy.json)
          {
            echo '### FinFolk frontend published'
            echo '- Live site: https://finfolk.com.au'
            echo "- Exact deployment: $deploy_url"
            echo "- Commit: $RELEASE_SHA"
            echo '- API and database were not deployed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-publish-receipts
          path: .cache/frontend-*-deploy.json
          if-no-files-found: ignore
